<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="description" content="PlayerNation — explainable football identity cards for 2,803 players and 211 coaches, built from Wyscout event data."/>
<meta name="color-scheme" content="dark"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>"/>
<title>PlayerNation — Football Identity Cards</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#121823; --panel2:#1a2230; --line:#243044;
    --txt:#e8eef7; --muted:#8a98ad; --gold:#f5c451;
    --good:#39d98a; --ok:#4aa8ff; --mid:#e08a3c; --low:#ff6b6b; --accent:#4aa8ff;
    --radius:16px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{scrollbar-gutter:stable}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:radial-gradient(1200px 600px at 50% -10%,#16202e 0%,var(--bg) 60%);color:var(--txt);min-height:100vh}
  a{color:var(--accent)}
  button{font:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none !important;animation:none !important}
  }

  header{position:sticky;top:0;z-index:30;background:rgba(10,14,20,.85);backdrop-filter:blur(10px);
         border-bottom:1px solid var(--line);padding:14px 20px}
  .brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand h1{font-size:18px;margin:0;letter-spacing:.5px}
  .brand .dot{color:var(--gold);font-weight:800}
  .tabs{margin-left:auto;display:flex;gap:6px}
  .tab{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);
       color:var(--muted);cursor:pointer;font-size:13px}
  .tab[aria-selected="true"]{background:var(--gold);color:#1a1300;border-color:var(--gold);font-weight:700}
  .controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  input,select{background:var(--panel);border:1px solid var(--line);color:var(--txt);
               padding:9px 12px;border-radius:9px;font-size:14px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .search{flex:1;min-width:220px}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}

  main{padding:20px;max-width:1280px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px}
  .morewrap{text-align:center;margin:22px 0 8px}
  .more{background:var(--panel);border:1px solid var(--line);color:var(--txt);
        padding:10px 26px;border-radius:22px;cursor:pointer;font-size:14px}
  .more:hover{border-color:var(--gold)}

  /* ---- mini player card ---- */
  .card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
        border-radius:var(--radius);padding:16px;cursor:pointer;text-align:left;width:100%;color:var(--txt);
        transition:transform .12s,border-color .12s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);border-color:var(--gold)}
  .card.elite{border-color:rgba(245,196,81,.55);box-shadow:0 0 0 1px rgba(245,196,81,.15) inset}
  .ctop{display:flex;justify-content:space-between;align-items:flex-start}
  .ovr{font-size:40px;font-weight:800;line-height:.9;color:var(--gold)}
  .ovr small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px;margin-top:4px}
  .pos{font-size:12px;font-weight:700;color:#0c1118;background:var(--gold);border-radius:6px;padding:3px 8px}
  .cname{font-size:16px;font-weight:700;margin:12px 0 2px}
  .cmeta{font-size:12px;color:var(--muted)}
  .arch{display:inline-block;margin-top:10px;font-size:11px;letter-spacing:.5px;color:var(--gold);
        border:1px solid rgba(245,196,81,.4);border-radius:20px;padding:3px 10px}
  .stars{color:var(--gold);font-size:12px;margin-top:10px;letter-spacing:2px}
  .miniattrs{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:12px}
  .ma{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .ma b{color:var(--txt)}

  /* ---- attribute meters ---- */
  .bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:0 4px 4px 0}

  /* ---- detail modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(4,7,11,.78);backdrop-filter:blur(4px);z-index:50;
           display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
  .overlay.show{display:flex}
  .detail{width:100%;max-width:860px;background:linear-gradient(160deg,#16202e,#0e141d);
          border:1px solid var(--line);border-radius:20px;padding:0;overflow:hidden}
  .dhead{display:flex;gap:20px;padding:24px;background:linear-gradient(120deg,rgba(245,196,81,.12),transparent);
         border-bottom:1px solid var(--line);align-items:center}
  .dovr{font-size:64px;font-weight:800;color:var(--gold);line-height:.85}
  .dovr small{display:block;font-size:12px;color:var(--muted);letter-spacing:2px}
  .dhead h2{margin:0 0 4px;font-size:26px}
  .dhead .sub{color:var(--muted);font-size:14px}
  .close{margin-left:auto;font-size:24px;color:var(--muted);cursor:pointer;background:none;border:none;
         align-self:flex-start;line-height:1;padding:4px 8px;border-radius:8px}
  .close:hover{color:var(--txt)}
  .dbody{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .dbody h3{font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin:0 0 12px}
  .attrrow{margin-bottom:14px}
  .attrrow .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .attrrow .val{font-weight:800}
  .attrrow .exp{font-size:11px;color:var(--muted);margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:4px 10px;border-radius:16px;border:1px solid var(--line)}
  .chip.good{color:var(--good);border-color:rgba(57,217,138,.4)}
  .chip.bad{color:var(--low);border-color:rgba(255,107,107,.35)}
  .rawgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-size:13px}
  .rawgrid div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
  .rawgrid span{color:var(--muted)}
  .rawgrid b{font-variant-numeric:tabular-nums}
  .share{grid-column:1/-1;margin-top:4px;background:#0c1118;border:1px solid rgba(245,196,81,.3);
         border-radius:14px;padding:18px;text-align:center}
  .share .big{font-size:34px;font-weight:800;color:var(--gold)}
  .share .hl{color:var(--txt);font-size:15px;margin-top:6px}
  .share .ar{color:var(--gold);font-size:13px;letter-spacing:1px;margin-top:4px}

  /* ---- coach card ---- */
  .ccard{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
         border-radius:var(--radius);padding:18px}
  .ccard.elite{border-color:rgba(245,196,81,.55);box-shadow:0 0 0 1px rgba(245,196,81,.15) inset}
  .ccard h3{margin:0;font-size:17px}
  .ccard .cc-sub{color:var(--muted);font-size:12px;margin:3px 0 12px}
  .ccard h4{font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin:14px 0 8px}
  .rec{display:flex;gap:14px;font-size:13px;margin-bottom:12px}
  .rec b{font-size:18px;font-variant-numeric:tabular-nums}
  .rec small{color:var(--muted);font-size:11px}
  .style-chip{display:inline-block;font-size:11px;color:var(--gold);border:1px solid rgba(245,196,81,.4);
              border-radius:20px;padding:3px 10px;margin-bottom:12px}
  .noprofile{color:var(--muted);font-size:12px;font-style:italic}
  .loading{text-align:center;color:var(--muted);padding:60px}
  footer{max-width:1280px;margin:0 auto;padding:8px 20px 28px;color:var(--muted);font-size:12px}
  @media(max-width:640px){.dbody{grid-template-columns:1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Player<span class="dot">Nation</span> · Football Identity Cards</h1>
    <div class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" id="tab-players" role="tab" aria-selected="true" aria-controls="players">Players</button>
      <button class="tab" id="tab-coaches" role="tab" aria-selected="false" aria-controls="coaches">Coaches</button>
    </div>
  </div>
  <div class="controls" id="playerControls">
    <input id="search" class="search" type="search" placeholder="Search a player… (e.g. Messi, De Bruyne, Oblak)" aria-label="Search players by name or nationality"/>
    <select id="posFilter" aria-label="Filter by position">
      <option value="">All positions</option>
      <option value="GK">Goalkeepers</option><option value="DF">Defenders</option>
      <option value="MD">Midfielders</option><option value="FW">Forwards</option>
    </select>
    <select id="sortBy" aria-label="Sort players">
      <option value="overall">Sort: Overall</option>
      <option value="finishing">Sort: Finishing</option>
      <option value="creativity">Sort: Creativity</option>
      <option value="passing">Sort: Passing</option>
      <option value="defending">Sort: Defending</option>
      <option value="work_rate">Sort: Work Rate</option>
    </select>
    <select id="confFilter" aria-label="Filter by confidence">
      <option value="0">Any confidence</option>
      <option value="5">★★★★★ only (proven)</option>
      <option value="4">★★★★ and up</option>
      <option value="3">★★★ and up</option>
    </select>
  </div>
  <div class="controls" id="coachControls" hidden>
    <input id="coachSearch" class="search" type="search" placeholder="Search a team… (e.g. Manchester City, Juventus)" aria-label="Search coaches by team or competition"/>
    <select id="coachSort" aria-label="Sort coaches">
      <option value="overall">Sort: Overall</option>
      <option value="points_per_match">Sort: Points per match</option>
      <option value="matches">Sort: Matches managed</option>
    </select>
  </div>
  <div class="hint" id="hint" role="status" aria-live="polite"></div>
</header>

<main>
  <div id="players" class="grid" role="tabpanel" aria-labelledby="tab-players"></div>
  <div id="coaches" class="grid" role="tabpanel" aria-labelledby="tab-coaches" hidden></div>
  <div class="morewrap" id="morewrap" hidden><button class="more" id="moreBtn">Show more</button></div>
  <div id="loading" class="loading">Loading ratings…</div>
</main>

<footer>
  Ratings computed from Wyscout 2017/18 public event data (5 leagues, Euro 2016, World Cup 2018).
  Attribute scores are position-group percentiles with Bayesian confidence shrinkage — see the README for methodology.
</footer>

<div class="overlay" id="overlay">
  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailName"></div>
</div>

<script>
'use strict';
const ATTRS = ["passing","creativity","finishing","defending","work_rate"];
const PAGE_SIZE = 120;

const state = { data:null, tab:'players', playerLimit:PAGE_SIZE, coachLimit:PAGE_SIZE, lastFocus:null };
const $ = id => document.getElementById(id);

/* every string that reaches innerHTML goes through this */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g,
    ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function debounce(fn, ms){
  let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a), ms);};
}

/* meter fill color by score band; the number itself stays in text color */
function color(v){ return v>=85?'var(--gold)':v>=70?'var(--good)':v>=55?'var(--ok)':v>=40?'var(--mid)':'var(--low)'; }
function stars(n){ return '★'.repeat(n)+'☆'.repeat(5-n); }
function bar(v){
  return `<div class="bar" role="img" aria-label="${v} out of 99">`+
         `<i style="width:${v}%;background:${color(v)}"></i></div>`;
}

async function load(){
  try{
    const r = await fetch('ratings.json');
    if(!r.ok) throw new Error('HTTP '+r.status);
    state.data = await r.json();
  }catch(e){
    $('loading').innerHTML =
      "Couldn't load <b>ratings.json</b> ("+esc(e.message)+").<br>Run <code>python process.py</code> then serve with "+
      "<code>python -m http.server 8000</code> and open <code>http://localhost:8000</code>.";
    return;
  }
  $('loading').style.display='none';

  const rerenderPlayers = ()=>{ state.playerLimit = PAGE_SIZE; renderPlayers(); };
  $('search').addEventListener('input', debounce(rerenderPlayers, 150));
  ['posFilter','sortBy','confFilter'].forEach(id=>$(id).addEventListener('input', rerenderPlayers));
  const rerenderCoaches = ()=>{ state.coachLimit = PAGE_SIZE; renderCoaches(); };
  $('coachSearch').addEventListener('input', debounce(rerenderCoaches, 150));
  $('coachSort').addEventListener('input', rerenderCoaches);

  $('tab-players').addEventListener('click', ()=>setTab('players'));
  $('tab-coaches').addEventListener('click', ()=>setTab('coaches'));
  $('moreBtn').addEventListener('click', ()=>{
    if(state.tab==='players'){ state.playerLimit += PAGE_SIZE; renderPlayers(); }
    else { state.coachLimit += PAGE_SIZE; renderCoaches(); }
  });

  /* one delegated listener instead of per-card inline handlers */
  $('players').addEventListener('click', e=>{
    const card = e.target.closest('[data-player-id]');
    if(card) openDetail(+card.dataset.playerId);
  });
  $('overlay').addEventListener('click', e=>{ if(e.target===$('overlay')) closeDetail(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });

  renderPlayers(); renderCoaches();
}

function filteredPlayers(){
  const q = $('search').value.toLowerCase().trim();
  const pos = $('posFilter').value;
  const sort = $('sortBy').value;
  const conf = +$('confFilter').value;
  const list = state.data.players.filter(p =>
    (!pos || p.position===pos) && (p.confidence_stars>=conf) &&
    (!q || p.name.toLowerCase().includes(q) ||
      (p.full_name||'').toLowerCase().includes(q) ||
      (p.nationality||'').toLowerCase().includes(q)));
  list.sort((a,b)=> sort==='overall' ? b.overall-a.overall
                                     : b.attributes[sort].score-a.attributes[sort].score);
  return list;
}

function renderPlayers(){
  if(state.tab!=='players') return;
  const list = filteredPlayers();
  const shown = list.slice(0, state.playerLimit);
  $('hint').textContent =
    `${list.length.toLocaleString()} players match — showing ${shown.length}. `+
    `${state.data.meta.n_players.toLocaleString()} rated players, ${state.data.meta.n_coaches} coaches across ${state.data.meta.competitions.length} competitions.`;
  $('players').innerHTML = shown.length
    ? shown.map(cardHTML).join('')
    : '<div class="empty">No players match those filters. Try clearing the search or lowering the confidence filter.</div>';
  updateMore(list.length, shown.length);
}

function cardHTML(p){
  const mini = ATTRS.map(a=>{
    const at = p.attributes[a];
    return `<div class="ma">${esc(at.label.split(' ')[0])} <b>${at.insufficient?'—':at.score}</b></div>`;
  }).join('');
  return `<button class="card ${p.overall>=85?'elite':''}" data-player-id="${p.id}"
      aria-label="Open identity card for ${esc(p.name)}">
    <div class="ctop"><div class="ovr">${p.overall}<small>OVERALL</small></div><div class="pos">${esc(p.position)}</div></div>
    <div class="cname">${esc(p.name)}</div>
    <div class="cmeta">${esc(p.nationality||'')} · ${p.matches} apps</div>
    <div class="arch">${esc(p.archetype)}</div>
    <div class="stars" aria-label="${p.confidence_stars} of 5 confidence stars">${stars(p.confidence_stars)}</div>
    <div class="miniattrs">${mini}</div>
  </button>`;
}

const RAW_LABELS = {goals:'Goals',assists:'Assists',shots:'Shots',goals_p90:'Goals / 90',
  key_passes_p90:'Key passes / 90',pass_completion:'Pass completion',shot_accuracy:'Shot accuracy',
  clearances_p90:'Clearances / 90',aerial_duels_p90:'Aerial duels / 90',save_pct:'Save %',
  clean_sheet_rate:'Clean-sheet rate',header_goals:'Header goals'};
const PCT_KEYS = new Set(['pass_completion','shot_accuracy','save_pct','clean_sheet_rate']);

function openDetail(id){
  const p = state.data.players.find(x=>x.id===id);
  if(!p) return;
  const attrRows = ATTRS.map(a=>{
    const at = p.attributes[a];
    const v = at.insufficient?0:at.score;
    return `<div class="attrrow"><div class="top"><span>${esc(at.label)}</span>
      <span class="val" style="color:${at.insufficient?'var(--muted)':'var(--txt)'}">${at.insufficient?'—':at.score}</span></div>
      ${at.insufficient?'<div class="bar"></div>':bar(v)}
      ${p.explainability[a]?`<div class="exp">${esc(p.explainability[a])}</div>`:''}</div>`;
  }).join('');
  const raw = Object.entries(RAW_LABELS).filter(([k])=>k in p.raw_stats).map(([k,lbl])=>{
    let v = p.raw_stats[k];
    if(PCT_KEYS.has(k)) v = Math.round(v*100)+'%';
    return `<div><span>${esc(lbl)}</span><b>${esc(v)}</b></div>`;
  }).join('');
  const str = p.strengths.map(s=>`<span class="chip good">✓ ${esc(s)}</span>`).join('')
              || '<span class="noprofile">—</span>';
  const imp = p.improvements.map(s=>`<span class="chip bad">${esc(s)}</span>`).join('')
              || '<span class="noprofile">No clear weakness</span>';
  $('detail').innerHTML = `
    <div class="dhead">
      <div class="dovr">${p.overall}<small>OVR</small></div>
      <div><h2 id="detailName">${esc(p.name)}</h2>
        <div class="sub">${esc(p.full_name||'')} · ${esc(p.position_label)} · ${esc(p.nationality||'')}</div>
        <div class="sub">${p.competitions.map(esc).join('  ·  ')}</div>
        <div class="arch" style="margin-top:8px">◆ ${esc(p.archetype)}</div>
        <div class="stars">${stars(p.confidence_stars)} · ${p.minutes.toLocaleString()} min · ${p.matches} apps</div>
      </div>
      <button class="close" aria-label="Close">✕</button>
    </div>
    <div class="dbody">
      <div><h3>Attributes</h3>${attrRows}</div>
      <div>
        <h3>Strengths</h3><div class="chips" style="margin-bottom:16px">${str}</div>
        <h3>Areas to improve</h3><div class="chips" style="margin-bottom:16px">${imp}</div>
        <h3>Season stats</h3><div class="rawgrid">${raw}</div>
      </div>
      <div class="share">
        <div class="big">${p.overall} · ${esc(p.position)}</div>
        <div class="hl">◆ ${esc(p.archetype.toUpperCase())}</div>
        <div class="ar">${esc(p.headline)}</div>
      </div>
    </div>`;
  $('detail').querySelector('.close').addEventListener('click', closeDetail);
  state.lastFocus = document.activeElement;
  $('overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
  $('detail').querySelector('.close').focus();
}

function closeDetail(){
  if(!$('overlay').classList.contains('show')) return;
  $('overlay').classList.remove('show');
  document.body.style.overflow = '';
  if(state.lastFocus){ state.lastFocus.focus(); state.lastFocus = null; }
}

const COACH_DIMS = [['attacking_intent','Attacking Intent'],['possession_control','Possession'],
  ['pressing_intensity','Pressing'],['defensive_solidity','Defensive Solidity'],
  ['width','Width'],['line_height','Line Height']];

function filteredCoaches(){
  const q = $('coachSearch').value.toLowerCase().trim();
  const sort = $('coachSort').value;
  const list = state.data.coaches.filter(c=>
    !q || (c.team||'').toLowerCase().includes(q) || (c.competition||'').toLowerCase().includes(q));
  list.sort((a,b)=> b[sort]-a[sort]);
  return list;
}

function renderCoaches(){
  const list = filteredCoaches();
  const shown = list.slice(0, state.coachLimit);
  if(state.tab==='coaches'){
    $('hint').textContent = `${list.length} coaches match — showing ${shown.length}. `+
      `Overall is results-based; tactical profiles need 15+ matches.`;
    updateMore(list.length, shown.length);
  }
  $('coaches').innerHTML = shown.length ? shown.map(coachHTML).join('')
    : '<div class="empty">No coaches match that search.</div>';
}

function coachHTML(c){
  const prof = c.has_profile
    ? `<div class="style-chip">◆ ${esc(c.style)}</div>`+
      COACH_DIMS.map(([k,l])=>`<div class="attrrow"><div class="top"><span>${esc(l)}</span>
        <span class="val">${c.profile[k]}</span></div>${bar(c.profile[k])}
        ${c.explainability&&c.explainability[k]?`<div class="exp">${esc(c.explainability[k])}</div>`:''}</div>`).join('')+
      (c.strengths&&c.strengths.length?`<h4>Tactical traits</h4>
        <div class="chips">${c.strengths.map(s=>`<span class="chip good">✓ ${esc(s)}</span>`).join('')}</div>`:'')
    : `<div class="noprofile">Too few matches (${c.matches}) for a tactical profile — Overall &amp; record only.</div>`;
  return `<div class="ccard ${c.overall>=85?'elite':''}">
    <div class="ctop"><div class="ovr">${c.overall}<small>OVERALL</small></div>
      <div class="stars" style="margin-top:2px">${stars(c.confidence_stars)}</div></div>
    <h3 style="margin-top:12px">${esc(c.team)}</h3><div class="cc-sub">${esc(c.competition)} · Head Coach</div>
    <div class="rec">
      <div><b>${c.record.W}</b><br><small>W</small></div>
      <div><b>${c.record.D}</b><br><small>D</small></div>
      <div><b>${c.record.L}</b><br><small>L</small></div>
      <div><b>${c.points_per_match}</b><br><small>PPG</small></div>
      <div><b>${c.goals_for}:${c.goals_against}</b><br><small>GF:GA</small></div>
    </div>
    ${prof}</div>`;
}

function updateMore(total, shown){
  $('morewrap').hidden = shown >= total;
  $('moreBtn').textContent = `Show more (${(total-shown).toLocaleString()} remaining)`;
}

function setTab(t){
  state.tab = t;
  document.querySelectorAll('.tab').forEach(b=>
    b.setAttribute('aria-selected', String(b.id === 'tab-'+t)));
  $('players').hidden = t!=='players';
  $('coaches').hidden = t!=='coaches';
  $('playerControls').hidden = t!=='players';
  $('coachControls').hidden = t!=='coaches';
  if(t==='players') renderPlayers(); else renderCoaches();
}

load();
</script>
</body>
</html>
